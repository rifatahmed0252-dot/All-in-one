<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.json">
<title>Thai Glass Calculator</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#6b7485;--primary:#1769ff;--primary2:#0f54d8;--border:#e4e8ef;--danger:#e5484d;--shadow:0 10px 30px rgba(20,35,60,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:90px}
header{padding:22px 18px 12px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:800;font-size:21px}.sub{font-size:12px;color:var(--muted);margin-top:3px}
.menu{width:42px;height:42px;border:0;border-radius:13px;background:var(--card);box-shadow:var(--shadow);font-size:24px}
main{padding:8px 16px}.hero{background:linear-gradient(135deg,#0b1220,#173c83);color:#fff;border-radius:24px;padding:22px;box-shadow:var(--shadow);margin-bottom:16px}
.hero h1{font-size:24px;margin:0 0 7px}.hero p{margin:0;color:#d7e1f6;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.action{border:0;text-align:left;cursor:pointer;min-height:108px}.icon{font-size:26px}.action strong{display:block;margin-top:10px;font-size:15px}.action span{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.section-title{font-size:16px;font-weight:800;margin:22px 2px 10px}
label{font-size:12px;color:var(--muted);font-weight:700;display:block;margin-bottom:7px}.measure{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select{width:100%;padding:13px;border:1px solid var(--border);border-radius:12px;font-size:16px;background:#fff;color:var(--text);outline:none}
input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(23,105,255,.12)}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font-size:15px;font-weight:800;cursor:pointer}.primary{background:var(--primary);color:#fff}.secondary{background:#eef3fb;color:#17438d}.danger{background:#fff0f0;color:var(--danger)}
.result{display:none}.total{background:linear-gradient(135deg,#1769ff,#0b4ac2);color:#fff;border-radius:20px;padding:20px;margin-top:14px}.total small{opacity:.8}.total strong{display:block;font-size:30px;margin-top:4px}
.row{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--border);font-size:13px}.row:last-child{border-bottom:0}.row b{font-size:14px}.pill{font-size:11px;background:#eef3fb;color:#31578e;padding:4px 7px;border-radius:99px}
.toolbar{display:flex;gap:10px;margin-top:12px}.toolbar .btn{flex:1}
.back{border:0;background:transparent;padding:8px 0;font-weight:700;color:var(--primary);font-size:14px}
.price-table{width:100%;border-collapse:collapse;font-size:12px}.price-table th,.price-table td{padding:8px 4px;border-bottom:1px solid var(--border);text-align:left}.price-table input{padding:8px;font-size:13px}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:5}.drawer.open{display:block}.sheet{position:absolute;right:0;top:0;height:100%;width:min(340px,88%);background:#fff;padding:22px;box-shadow:-12px 0 30px rgba(0,0,0,.15)}.sheet h2{margin-top:0}.menuitem{width:100%;padding:14px 8px;border:0;background:none;text-align:left;font-size:15px;border-bottom:1px solid var(--border)}
.hidden{display:none!important}
@media(prefers-color-scheme:dark){
 body{--bg:#0d1320;--card:#151d2c;--text:#f2f5fa;--muted:#9ba6b8;--border:#273247}
 input,select{background:#111927;color:var(--text)}.secondary{background:#1d2a40;color:#cfe0ff}.sheet{background:#151d2c}.menu{background:#151d2c;color:#fff}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div><div class="brand">Thai Glass Calculator</div></div>
  <button class="menu" onclick="toggleMenu()">⋮</button>
</header>

<main id="home">
  <div class="hero">
    <h1>Thai Glass Calculator</h1>
    
  </div>

  <div class="grid">
    <button class="card action" onclick="showPage('calc')">
      <span class="icon">📐</span>
      <strong>নতুন হিসাব</strong>
      
    </button>

    <button class="card action" onclick="showPage('prices')">
      <span class="icon">💰</span>
      <strong>দাম সেটিংস</strong>
      
    </button>
  </div>
</main>

<main id="calc" class="hidden">
<button class="back" onclick="showPage('home')">‹ Home</button>
<div class="section-title">জানালার মাপ</div>
<div class="card">
  <div class="measure">
    <div><label>Height — Inch</label><input id="hi" type="number" min="0" step="1" placeholder="54"></div>
    <div><label>Height — Suta</label><input id="hs" type="number" min="0" max="7.5" step=".5" placeholder="2"></div>
    <div><label>Width — Inch</label><input id="wi" type="number" min="0" step="1" placeholder="46"></div>
    <div><label>Width — Suta</label><input id="ws" type="number" min="0" max="7.5" step=".5" placeholder="4"></div>
  </div>
  <div style="margin-top:14px"><button class="btn primary" onclick="calculate()">Calculate</button></div>
</div>
<div id="result" class="result">
  <div class="section-title">হিসাবের ফলাফল</div>
  <div class="card" id="rows"></div>
  <div class="total"><small>মোট আনুমানিক খরচ</small><strong id="total">৳0</strong></div>
  <div class="toolbar"><button class="btn secondary" onclick="window.print()">Print</button><button class="btn danger" onclick="resetCalc()">Reset</button></div>
</div>
</main>

<main id="prices" class="hidden">
<button class="back" onclick="showPage('home')">‹ Home</button>
<div class="section-title">দাম সেটিংস</div>
<div class="card"><p style="font-size:12px;color:var(--muted)">21 ft/100 ft-এর দাম বদলালে per-foot নিজে হিসাব হবে। Glass-এর দাম sq ft হিসেবে সেট করা যাবে।</p>
<table class="price-table"><thead><tr><th>Material</th><th>Unit</th><th>Full price</th><th>Custom/ft</th></tr></thead><tbody id="priceRows"></tbody></table>
<div style="margin-top:14px"><button class="btn primary" onclick="savePrices()">Save Prices</button></div>
</div>
</main>
</div>

<div id="drawer" class="drawer" onclick="if(event.target===this)toggleMenu()"><div class="sheet"><h2>Menu</h2>
<button class="menuitem" onclick="showPage('home');toggleMenu()">🏠 Home</button>
<button class="menuitem" onclick="showPage('calc');toggleMenu()">📐 New Calculation</button>
<button class="menuitem" onclick="showPage('prices');toggleMenu()">⚙️ Price Settings</button>
<button class="menuitem" onclick="alert('History, customer name, labour cost ও invoice পরে যোগ করা হবে।')">📋 History</button>
<button class="menuitem" onclick="alert('এটি এখন প্রথম version। পরে Backup/Restore যোগ করা যাবে।')">💾 Backup / Restore</button>
<button class="menuitem" onclick="alert('Thai Glass Calculator — Version 1.0')">ℹ️ About</button>
</div></div>

<script>
const defaults=[
["Outer Site","ft",1400,0],["Outer Top","ft",1500,0],["Outer Bottom","ft",1650,0],
["Shuter Lock","ft",1950,0],["Shuter Inter Lock","ft",1850,0],["Shuter Top","ft",1450,0],
["Shuter Bottom","ft",1650,0],["Rubber","100",300,0],["Wheel","piece",80,0],["Lock","piece",130,0],["Glass","sqft",0,0]
];
const savedPrices=JSON.parse(localStorage.getItem("tg_prices")||"null")||[];
// Merge saved settings with new materials so older installs still get the Glass price row.
let prices=defaults.map(d=>{const old=savedPrices.find(r=>r&&r[0]===d[0]);return old?[d[0],d[1],Number(old[2]??d[2]),Number(old[3]??d[3])]:[...d]});

function toggleMenu(){document.getElementById("drawer").classList.toggle("open")}
function showPage(p){["home","calc","prices"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==p));if(p==="prices")renderPrices();window.scrollTo(0,0)}
function money(n){return "৳"+Math.round(n).toLocaleString("en-US")}
function feet(i,s){return (Number(i||0)+Number(s||0)/8)/12}
function pricePerFt(row){return row[3] ? Number(row[3]) : Number(row[2])/(row[1]==="100"?100:21)}
function pricePerSqFt(row){return Number(row[2])}
function formatMeasure(ft){
 const totalSuta=Math.round(Math.max(0,ft)*12*8*2)/2;
 const inch=Math.floor(totalSuta/8);
 const suta=totalSuta-inch*8;
 return `${inch}″ ${suta} সুতা`;
}
function unitLabel(u){return u==="ft"?"21 ft":u==="100"?"100 ft":u==="sqft"?"sq ft":u;}
function renderPrices(){
 const body=document.getElementById("priceRows");
 body.innerHTML=prices.map((r,i)=>`<tr><td>${r[0]}</td><td>${unitLabel(r[1])}</td><td><input id="p${i}" type="number" value="${r[2]}"></td><td>${(r[1]==="piece"||r[1]==="sqft")?"—":`<input id="c${i}" type="number" value="${r[3]||""}" placeholder="Auto">`}</td></tr>`).join("");
}
function savePrices(){
 prices.forEach((r,i)=>{r[2]=Number(document.getElementById("p"+i).value)||0;r[3]=Number(document.getElementById("c"+i)?.value)||0});
 localStorage.setItem("tg_prices",JSON.stringify(prices)); alert("দামগুলো Save হয়েছে।"); renderPrices();
}
function calculate(){
 const H=feet(document.getElementById("hi").value,document.getElementById("hs").value);
 const W=feet(document.getElementById("wi").value,document.getElementById("ws").value);
 if(!H||!W){alert("Height ও Width দিন।");return}
 const shH=H-(1+1/8)/12;
 const shW=(W-(5+7/8)/12)/2;
 const lengths=[
  2*H,
  W-(4/8)/12,
  W-(4/8)/12,
  2*shH,
  2*shH,
  2*shW,
  2*shW,
  2*(2*shH+2*shW)
 ];
 const labels=["Outer Site","Outer Top","Outer Bottom","Shuter Lock","Shuter Inter Lock","Shuter Top","Shuter Bottom","Rubber"];
 const pieceCounts=[2,1,1,2,2,2,2,1];
 const pieceLengths=[H,W-(4/8)/12,W-(4/8)/12,shH,shH,shW,shW,2*(2*shH+2*shW)];
 let total=0, out="";
 labels.forEach((name,i)=>{
   const r=prices[i],cost=lengths[i]*pricePerFt(r);total+=cost;
   const detail=i===7?`${lengths[i].toFixed(2)} ft total`:`${pieceCounts[i]} pcs · প্রতিটি: ${formatMeasure(pieceLengths[i])}`;
   out+=`<div class="row"><span>${name}<br><small>${detail}<br>মোট দৈর্ঘ্য: ${lengths[i].toFixed(2)} ft</small></span><b>${money(cost)}</b></div>`;
 });
 const wheel=4*prices[8][2], lock=2*prices[9][2]; total+=wheel+lock;
 out+=`<div class="row"><span>Wheel<br><small>4 pcs · প্রতি পিস ${money(prices[8][2])}</small></span><b>${money(wheel)}</b></div><div class="row"><span>Lock<br><small>2 pcs · প্রতি পিস ${money(prices[9][2])}</small></span><b>${money(lock)}</b></div>`;
 const glassH=shH, glassW=shW, oneGlassSqFt=glassH*glassW, totalGlassSqFt=oneGlassSqFt*2;
 const glassRate=pricePerSqFt(prices[10]), oneGlassCost=oneGlassSqFt*glassRate;
 const glassCost=totalGlassSqFt*glassRate; total+=glassCost;
 out+=`<div class="row"><span>Glass<br><small>2 pcs · প্রতি গ্লাস: ${formatMeasure(glassH)} × ${formatMeasure(glassW)}<br>প্রতি গ্লাস: ${oneGlassSqFt.toFixed(2)} sq ft · ${money(oneGlassCost)}<br>মোট: ${totalGlassSqFt.toFixed(2)} sq ft · রেট ${money(glassRate)}/sq ft</small></span><b>${money(glassCost)}</b></div>`;
 document.getElementById("rows").innerHTML=out;
 document.getElementById("total").textContent=money(total);
 document.getElementById("result").style.display="block";
}
function resetCalc(){["hi","hs","wi","ws"].forEach(id=>document.getElementById(id).value="");document.getElementById("result").style.display="none"}
renderPrices();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
